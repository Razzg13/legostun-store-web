<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Legostun Store</title>
  <meta name="description" content="Legostun Store — tecnología, hogar, belleza y accesorios a precios bajos. Pedí por WhatsApp.">
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">📦 Legostun Store</div>
    </header>
    <div class="tagline">De todo un poco, a precios bajos — pedís y te llega</div>
    <div class="meta">Elegí tus productos y enviá el pedido directo por WhatsApp.</div>

      <button class="send-btn" id="sendBtn" disabled>
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M20.5 3.5A10.6 10.6 0 0 0 3.6 17.1L2 22l5.1-1.6A10.6 10.6 0 0 0 20.5 3.5Zm-8.4 16.3a8.8 8.8 0 0 1-4.5-1.2l-.3-.2-3 1 1-2.9-.2-.3A8.8 8.8 0 1 1 20.4 12a8.8 8.8 0 0 1-8.3 7.8Zm4.8-6.6c-.3-.1-1.6-.8-1.8-.9-.2-.1-.4-.1-.6.1-.2.2-.6.9-.8 1-.1.2-.3.2-.5.1-1.3-.5-2.4-1.4-3.2-2.7-.1-.2-.1-.4.1-.6.2-.2.5-.5.6-.7.1-.2.1-.4 0-.6-.1-.2-.6-1.5-.8-2-.2-.4-.4-.4-.6-.4h-.5c-.2 0-.5.1-.7.4-.2.3-.9 1-.9 2.3s.9 2.6 1 2.8c.1.2 1.8 2.8 4.5 3.8 2.6 1 2.6.7 3.1.6.5 0 1.6-.6 1.8-1.2.2-.6.2-1.2.2-1.3-.1-.1-.3-.2-.6-.3Z"/></svg>
        Pedir por WhatsApp
      </button>
    </div>
  </div>

  <div class="toast" id="toast">Agregado</div>

  <script src="products.js"></script>
  <script src="app.js"></script>
</body>
</html>
